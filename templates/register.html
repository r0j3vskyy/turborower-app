{% extends "base.html" %}
{% block title %}Rejestracja — TurboRower{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Utwórz konto</h1>
  <form method="post">
    <label for="name">Imię i nazwisko</label><input id="name" name="name" required>
    <label for="email">E-mail</label><input id="email" name="email" type="email" required>
    <label for="password">Hasło (min. 6 znaków)</label><input id="password" name="password" type="password" minlength="6" required>
    <button class="primary" type="submit">Zarejestruj się</button>
  </form>
  <p>Masz konto? <a href="{{ url_for('login') }}">Zaloguj się</a></p>
</section>
{% endblock %}
