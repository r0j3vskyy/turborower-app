<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TurboRower{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('vehicles') if current_user else url_for('login') }}">TurboRower</a>
        {% if current_user %}
        <nav>
            <a href="{{ url_for('vehicles') }}">Pojazdy</a>
            <a href="{{ url_for('history') }}">Historia</a>
            <form method="post" action="{{ url_for('logout') }}" class="inline-form">
                <button class="link-button" type="submit">Wyloguj</button>
            </form>
        </nav>
        {% endif %}
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="messages" aria-live="polite">
                {% for category, message in messages %}
                    <p class="message {{ category }}">{{ message }}</p>
                {% endfor %}
                </section>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
